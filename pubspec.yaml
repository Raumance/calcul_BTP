name: calcul_projet
description: "Application BTP — quantitatifs, devis, plans et calculs électriques (NF C 15-100)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  go_router: ^14.8.1
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.3
  uuid: ^4.5.1
  intl: any
  image_picker: ^1.1.2
  pdf: ^3.11.3
  printing: ^5.14.2
  excel: ^4.0.6
  web_socket_channel: ^3.0.2
  collection: ^1.19.1
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3
  share_plus: ^10.1.4
  cross_file: ^0.3.4+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    icon_size: 256
  web:
    generate: true
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: "#1A5FA8"
  adaptive_icon_foreground: assets/icons/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.png
