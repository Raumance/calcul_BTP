# Docker Compose — stack production (API + PostgreSQL + Redis)
services:
  db:
    image: postgres:16-alpine
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: calcul
      POSTGRES_USER: calcul
      # Aligné explicitement avec backend/.env (évite un mauvais ${} depuis le shell hôte)
      POSTGRES_PASSWORD: changeme
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calcul -d calcul"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://calcul:changeme@db:5432/calcul
      REDIS_URL: redis://redis:6379/0
      USE_INMEMORY_CHANNEL_LAYER: "false"
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["/app/venv/bin/python", "start.py"]

volumes:
  pgdata:
