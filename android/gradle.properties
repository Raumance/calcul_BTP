# Machine ~7 Go RAM : heap bas + peu de workers pour éviter le crash JVM.
org.gradle.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dkotlin.daemon.jvm.options=-Xmx512m
android.useAndroidX=true
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx512m
